name: george-webber

x-runtime: &runtime
  image: george-webber-dev:local
  build: .
  working_dir: /workspaces/site
  init: true
  volumes:
    - .:/workspaces/site

services:
  site:
    <<: *runtime
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:35729:35729"
    environment:
      JEKYLL_ENV: development
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

  tests:
    <<: *runtime
    profiles: [test]
    command: ["npm", "test"]
    environment:
      CI: "true"
