name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "_plugins/**"
      - ".devcontainer/**"
      - ".dockerignore"
      - "tests/**"
      - "**.cjs"
      - "Dockerfile"
      - "package*.json"
      - "site.ps1"
      - "site.cmd"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "_plugins/**"
      - ".devcontainer/**"
      - ".dockerignore"
      - "tests/**"
      - "**.cjs"
      - "Dockerfile"
      - "package*.json"
      - "site.ps1"
      - "site.cmd"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    uses: ./.github/workflows/regression.yml
    permissions:
      contents: read

  deploy:
    needs: regression
    if: github.event_name != 'pull_request'
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Download tested production site
        uses: actions/download-artifact@v5
        with:
          name: tested-production-site
          path: _site
      - name: Verify deployment artifact
        run: |
          test -s _site/index.html
          test -s _site/publications/index.html
          test -s _site/assets/css/main.css
          test "$(cat _site/CNAME)" = "george-webber.com"
      - name: Deploy tested site 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
